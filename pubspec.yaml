name: expense_tracker
description: Kharcha — personal expense tracker with Supabase backend.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  change_app_package_name: ^1.5.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  intl: ^0.20.2
  fl_chart: ^1.0.0
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.2.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#0D1117"
  android_12:
    color: "#0D1117"

flutter:
  uses-material-design: true
  assets:
    - .env
